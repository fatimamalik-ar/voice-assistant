<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatima's Voice Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--lvl:0;--bg:#0a0816;--card:#15112a;--line:#ffffff1c;--text:#f3effa;--muted:#a79fc2;--head:'Space Grotesk',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif}
body[data-s=idle]{--c1:#7c5cff;--c2:#22d3ee;--c3:#c084fc}
body[data-s=listening]{--c1:#34d399;--c2:#22d3ee;--c3:#a3e635}
body[data-s=thinking]{--c1:#fbbf24;--c2:#fb7185;--c3:#f97316}
body[data-s=speaking]{--c1:#f472b6;--c2:#8b5cf6;--c3:#38bdf8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--c1) 22%,transparent),transparent 55%),var(--bg);color:var(--text);font:16px/1.6 var(--body);transition:background .6s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--c2);outline-offset:3px}
.wrap{max-width:760px;margin:auto;padding:28px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
header{width:100%;display:flex;justify-content:space-between;align-items:center}
h1{font:700 22px var(--head);margin:0;letter-spacing:-.01em}
.mute{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:7px 16px;font-size:14px}
.mute[aria-pressed=true]{color:var(--muted)}
/* the orb */
.orb{position:relative;width:230px;height:230px;border:0;background:none;border-radius:50%;margin:26px 0 6px;padding:0}
.core,.gloss,.ring{position:absolute;inset:0;border-radius:50%}
.core{background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1));box-shadow:0 0 70px color-mix(in srgb,var(--c1) 55%,transparent),inset 0 0 40px #0006;transform:scale(calc(1 + var(--lvl)*.4));transition:transform .08s,box-shadow .6s;animation:breathe 4s ease-in-out infinite}
.gloss{background:radial-gradient(circle at 32% 28%,#ffffffb0,transparent 38%);pointer-events:none;transform:scale(calc(1 + var(--lvl)*.4))}
.ring{border:2px solid var(--c2);opacity:0}
body[data-s=listening] .ring,body[data-s=speaking] .ring{animation:ring 2s ease-out infinite}
.ring.r2{animation-delay:1s!important}
body[data-s=thinking] .core{animation:spin 1.1s linear infinite}
body[data-s=speaking] .core{animation:talk .7s ease-in-out infinite alternate}
@keyframes breathe{50%{filter:brightness(1.12);transform:scale(calc(1.04 + var(--lvl)*.4))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{from{transform:scale(.97)}to{transform:scale(1.08)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.65);opacity:0}}
#status{font:500 18px var(--head);margin:0;text-align:center}
#cap{min-height:28px;margin:0;color:var(--muted);text-align:center;max-width:56ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:7px 15px;font-size:14px}
.chips button:hover{border-color:var(--c2)}
.panel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
#log{max-height:34vh;min-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
#empty{color:var(--muted);text-align:center;margin:auto;font-size:15px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--c1) 70%,#000);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#ffffff12;border-bottom-left-radius:4px}
form{display:flex;gap:8px;margin-top:12px}
input{flex:1;background:#0003;border:1px solid var(--line);border-radius:30px;padding:10px 16px;color:var(--text);font:inherit}
form button{border:0;border-radius:30px;padding:0 20px;background:var(--text);color:var(--bg);font-weight:700}
.note{color:#fbbf24;font-size:14px;text-align:center;margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-s="idle">
<div class="wrap">
  <header>
    <h1>Fatima's Voice Assistant</h1>
    <button class="mute" id="mute" aria-pressed="false">Voice on</button>
  </header>

  <button class="orb" id="orb" aria-label="Talk to the assistant">
    <span class="ring r1"></span><span class="ring r2"></span>
    <span class="core"></span><span class="gloss"></span>
  </button>

  <p id="status" aria-live="polite">Tap the orb and say something</p>
  <p id="cap" aria-live="polite"></p>
  <p class="note" id="note" hidden>Voice input needs Chrome or Edge. You can still type below.</p>

  <div class="chips" id="chips"></div>

  <div class="panel">
    <div id="log"><p id="empty">Your conversation will appear here.</p></div>
    <form id="form">
      <input id="text" autocomplete="off" placeholder="Or type a message..." aria-label="Type a message">
      <button>Send</button>
    </form>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let state = 'idle', rec = null, muted = false, voice = null, mic = {};

const STATUS = {
  idle: 'Tap the orb and say something',
  listening: 'Listening...',
  thinking: 'Thinking...',
  speaking: 'Speaking... tap the orb to stop'
};
function setState(s) {
  state = s;
  document.body.dataset.s = s;
  $('status').textContent = STATUS[s];
}

function add(who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;           // text only, never HTML
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  if ($('empty')) $('empty').remove();
}

/* ----- the orb reacts to your voice volume ----- */
async function startMeter() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser();
    an.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    mic = { ctx, stream, raf: 0 };
    (function loop() {
      an.getByteFrequencyData(buf);
      const avg = buf.reduce((a, b) => a + b, 0) / buf.length;
      document.documentElement.style.setProperty('--lvl', Math.min(1, avg / 90));
      mic.raf = requestAnimationFrame(loop);
    })();
  } catch (e) { /* the orb still works without the meter */ }
}
function stopMeter() {
  cancelAnimationFrame(mic.raf);
  if (mic.stream) mic.stream.getTracks().forEach((t) => t.stop());
  if (mic.ctx) mic.ctx.close();
  document.documentElement.style.setProperty('--lvl', 0);
  mic = {};
}

/* ----- listening ----- */
function listen() {
  if (!SR) { $('note').hidden = false; return; }
  speechSynthesis.cancel();
  rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = true;
  let finalText = '';
  rec.onstart = () => { setState('listening'); startMeter(); };
  rec.onresult = (e) => {
    let interim = '';
    for (const r of e.results) {
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    $('cap').textContent = finalText + interim;   // live captions
  };
  rec.onerror = (e) => {
    stopMeter();
    setState('idle');
    $('cap').textContent =
      e.error === 'not-allowed' ? 'Microphone is blocked. Allow it in the address bar and try again.' :
      e.error === 'no-speech' ? 'I did not hear anything. Tap the orb and try again.' :
      'Speech error: ' + e.error;
  };
  rec.onend = () => {
    stopMeter();
    if (state === 'listening') {
      if (finalText.trim()) send(finalText.trim()); else setState('idle');
    }
  };
  rec.start();
}

/* ----- asking the Python brain ----- */
async function send(text) {
  add('me', text);
  $('cap').textContent = '';
  setState('thinking');
  try {
    const res = await fetch('/api/reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    add('bot', data.reply);
    say(data.reply);
  } catch (e) {
    add('bot', 'I cannot reach my brain. Is the Python server running?');
    setState('idle');
  }
}

/* ----- speaking ----- */
function pickVoice() {
  const v = speechSynthesis.getVoices().filter((x) => x.lang.startsWith('en'));
  voice = v.find((x) => /female|zira|samantha|aria|jenny/i.test(x.name)) || v[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function say(text) {
  if (muted) { setState('idle'); return; }
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.pitch = 1.05;
  u.onstart = () => setState('speaking');
  u.onend = u.onerror = () => setState('idle');
  speechSynthesis.speak(u);
}

/* ----- buttons ----- */
$('orb').addEventListener('click', () => {
  if (state === 'speaking') { speechSynthesis.cancel(); setState('idle'); }
  else if (state === 'listening') { rec.stop(); }
  else if (state === 'idle') { listen(); }
});

$('mute').addEventListener('click', () => {
  muted = !muted;
  $('mute').textContent = muted ? 'Voice off' : 'Voice on';
  $('mute').setAttribute('aria-pressed', muted);
  if (muted) speechSynthesis.cancel();
});

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = $('text').value.trim();
  if (t) { $('text').value = ''; speechSynthesis.cancel(); send(t); }
});

['What time is it?', 'Tell me a joke', 'Who are you?', 'Her projects', 'Her skills'].forEach((q) => {
  const b = document.createElement('button');
  b.textContent = q;
  b.addEventListener('click', () => { speechSynthesis.cancel(); send(q); });
  $('chips').appendChild(b);
});

if (!SR) $('note').hidden = false;
</script>
</body>
</html>
